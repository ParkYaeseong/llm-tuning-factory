name: Windows desktop pilot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'scripts/build_desktop.py'
      - 'scripts/pyinstaller-hooks/**'
      - 'scripts/desktop_entry.py'
      - 'scripts/verify_desktop_package.py'
      - 'scripts/seed_acceptance_root.py'
      - 'examples/**'
      - 'configs/ai/**'
      - 'containers/gpu*.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - run: uv sync --python 3.12 --extra dev --extra tracking --locked
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run python scripts/build_desktop.py
      - run: uv run python scripts/verify_desktop_package.py
      - run: npm ci
        working-directory: desktop
      - run: npm exec playwright install chromium
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release
        working-directory: desktop
      - run: npm run tauri -- build --ci
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-pilot-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30
