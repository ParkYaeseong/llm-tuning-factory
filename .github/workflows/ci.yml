name: CPU verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --python 3.12 --extra dev --extra tracking --locked
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/check_secrets.py
      - run: uv run pytest -m "not gpu" -q
