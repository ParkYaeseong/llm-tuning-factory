[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-tuning-factory"
version = "0.1.0"
description = "Reproducible, dry-run-first LLaMA-Factory job control plane"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.14.1", "PyYAML==6.0.3", "typer==0.27.3", "httpx==0.28.1", "paramiko==5.0.0", "boto3==1.43.114"]

[project.optional-dependencies]
tracking = ["mlflow-skinny==3.17.1"]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
factory = "tuning_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tuning_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires explicitly authorized real GPU infrastructure",
           "slow: takes tens of seconds; runs by default (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
